# Uploads the site to Afrihost over FTP whenever main changes.
#
# Set these under Settings > Secrets and variables > Actions:
#   secrets  FTP_SERVER     e.g. ftp.plaashek.co.za
#            FTP_USERNAME   the Afrihost / cPanel FTP login
#            FTP_PASSWORD
#   variables (optional)
#            FTP_SERVER_DIR folder the site lives in, default public_html/
#            FTP_PROTOCOL   ftps (default) or ftp if the host refuses TLS
#
# The action keeps .ftp-deploy-sync-state.json on the server and only sends
# files that changed since the last run. The first run uploads everything.
name: Deploy to Afrihost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README*
